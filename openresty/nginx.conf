env DSH_GW_SECRET;
env COOKIE_SECURE;
env COOKIE_TTL_SECONDS;

worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    lua_package_path '/usr/local/openresty/nginx/conf/?.lua;;';
    lua_code_cache on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr $status $request_time $request';
    access_log /dev/stdout main;

    server {
        listen 80;
        server_name _;
        client_max_body_size 300m;
        client_body_buffer_size 1m;

        set $dsh_upstream '';

        location = /login {
            content_by_lua_file /usr/local/openresty/nginx/conf/login.lua;
        }

        location = /logout {
            content_by_lua_file /usr/local/openresty/nginx/conf/logout.lua;
        }

        location = /me {
            access_by_lua_file /usr/local/openresty/nginx/conf/access.lua;
            content_by_lua_file /usr/local/openresty/nginx/conf/me.lua;
        }

        location / {
            access_by_lua_file /usr/local/openresty/nginx/conf/access.lua;
            proxy_pass http://$dsh_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
